name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck first: it builds the packages' declaration files, which
      # type-aware linting needs in order to resolve cross-package imports.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test, with coverage floors
        run: pnpm vitest run --coverage

      # Every route of the mobile app, rendered against a real SQLite ledger.
      # Native engines are stood in for here and exercised by the Maestro
      # flows on an emulator before a release (docs/running-locally.md).
      - name: Test the mobile screens
        run: pnpm --filter @budget/mobile test:coverage

      # The web driver runs SQLite compiled to WASM over OPFS, and neither
      # exists outside a real browser. Shimming it would make the suite green
      # without checking the storage the ledger actually lives in.
      - name: Install the test browser
        run: pnpm --filter @budget/web exec playwright install --with-deps chromium

      - name: Test the web build in a browser
        run: pnpm --filter @budget/web exec vitest run --coverage

      # The bundle is a promise: no third-party code, and a size a phone can
      # actually load. Both are checked against the built output, not intended.
      - name: Build the web app
        run: pnpm --filter @budget/web build

      - name: Check the bundle budget
        run: node tools/bundle-budget.mjs
